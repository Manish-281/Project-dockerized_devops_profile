<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Manish</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="page-container">
        <a href="/" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back
        </a>

        <div class="page-card welcome-card">
            <div class="welcome-icon">🚀</div>
            <h1>Welcome!</h1>
            <p class="welcome-msg">
                Hello! I'm <strong>Manish</strong>, a passionate <strong>Cloud/DevOps Engineer</strong> 
                based in India. I love building scalable infrastructure, automating deployments, 
                and working with cloud technologies.
            </p>
            <p class="welcome-msg">
                This API is built with <strong>Node.js</strong>, <strong>Express</strong>, and 
                <strong>Docker</strong>, and deployed on <strong>AWS EC2</strong>.
            </p>
            <div class="welcome-actions">
                <a href="/profile" class="btn btn-primary">
                    <i class="fas fa-user"></i> View Profile
                </a>
                <a href="/skills" class="btn btn-secondary">
                    <i class="fas fa-code"></i> View Skills
                </a>
            </div>
        </div>
    </div>

</html>
