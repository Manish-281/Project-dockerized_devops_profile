<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manish | DevOps Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="avatar">👨‍💻</div>
            <h1>Manish</h1>
            <p class="subtitle">Cloud/DevOps Engineer</p>
        </div>

        <!-- Skills Badges -->
        <div class="badges">
            <span class="badge aws">AWS</span>
            <span class="badge docker">Docker</span>
            <span class="badge k8s">Kubernetes</span>
            <span class="badge jenkins">Jenkins</span>
            <span class="badge cicd">CI/CD</span>
            <span class="badge linux">Linux</span>
            <span class="badge network">Networking</span>
            <span class="badge git">Git & GitHub</span>
        </div>

        <!-- Endpoints (links) -->
        <div class="endpoints">
            <a href="/welcome" class="endpoint">
                <div class="endpoint-left">
                    <span class="method">GET</span>
                    <span class="path">/welcome</span>
                </div>
                <span class="desc">Welcome message</span>
                <span class="arrow">→</span>
            </a>

            <a href="/profile" class="endpoint">
                <div class="endpoint-left">
                    <span class="method">GET</span>
                    <span class="path">/profile</span>
                </div>
                <span class="desc">Profile information</span>
                <span class="arrow">→</span>
            </a>

            <a href="/skills" class="endpoint">
                <div class="endpoint-left">
                    <span class="method">GET</span>
                    <span class="path">/skills</span>
                </div>
                <span class="desc">Skills list</span>
                <span class="arrow">→</span>
            </a>

            <a href="/health" class="endpoint">
                <div class="endpoint-left">
                    <span class="method">GET</span>
                    <span class="path">/health</span>
                </div>
                <span class="desc">Health-check</span>
                <span class="arrow">→</span>
            </a>
        </div>

        <!-- Footer -->
        <div class="footer">
            Built with ❤️ using Node.js, Express & Docker
        </div>
    </div>
</body>
</html>
