<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills | Manish</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="page-container">
        <a href="/" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back
        </a>

        <div class="page-card">
            <h1 class="page-title">My Skills</h1>
            <p class="page-subtitle">Technologies I work with</p>

            <div class="skills-grid">
                <div class="skill-card">
                    <i class="fab fa-aws skill-icon" style="color: #FF9900;"></i>
                    <div class="skill-name">AWS</div>
                    <div class="skill-level">Intermediate</div>
                    <div class="skill-bar"><div class="skill-fill" style="width: 65%; background: #FF9900;"></div></div>
                </div>

                <div class="skill-card">
                    <i class="fab fa-docker skill-icon" style="color: #2496ED;"></i>
                    <div class="skill-name">Docker</div>
                    <div class="skill-level">Intermediate</div>
                    <div class="skill-bar"><div class="skill-fill" style="width: 70%; background: #2496ED;"></div></div>
                </div>

                <div class="skill-card">
                    <i class="fas fa-dharmachakra skill-icon" style="color: #326CE5;"></i>
                    <div class="skill-name">Kubernetes</div>
                    <div class="skill-level">Beginner</div>
                    <div class="skill-bar"><div class="skill-fill" style="width: 40%; background: #326CE5;"></div></div>
                </div>

                <div class="skill-card">
                    <i class="fas fa-cogs skill-icon" style="color: #D33833;"></i>
                    <div class="skill-name">Jenkins</div>
                    <div class="skill-level">Beginner</div>
                    <div class="skill-bar"><div class="skill-fill" style="width: 40%; background: #D33833;"></div></div>
                </div>

                <div class="skill-card">
                    <i class="fas fa-sync-alt skill-icon" style="color: #4CAF50;"></i>
                    <div class="skill-name">CI/CD</div>
                    <div class="skill-level">Intermediate</div>
                    <div class="skill-bar"><div class="skill-fill" style="width: 65%; background: #4CAF50;"></div></div>
                </div>

                <div class="skill-card">
                    <i class="fab fa-linux skill-icon" style="color: #FCC624;"></i>
                    <div class="skill-name">Linux</div>
                    <div class="skill-level">Intermediate</div>
                    <div class="skill-bar"><div class="skill-fill" style="width: 75%; background: #FCC624;"></div></div>
                </div>

                <div class="skill-card">
                    <i class="fas fa-network-wired skill-icon" style="color: #9C27B0;"></i>
                    <div class="skill-name">Networking</div>
                    <div class="skill-level">Intermediate</div>
                    <div class="skill-bar"><div class="skill-fill" style="width: 60%; background: #9C27B0;"></div></div>
                </div>

                <div class="skill-card">
                    <i class="fab fa-git-alt skill-icon" style="color: #F05032;"></i>
                    <div class="skill-name">Git & GitHub</div>
                    <div class="skill-level">Intermediate</div>
                    <div class="skill-bar"><div class="skill-fill" style="width: 70%; background: #F05032;"></div></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
