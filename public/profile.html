<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Manish</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="page-container">
        <a href="/" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back
        </a>

        <div class="page-card">
            <div class="profile-header">
                <div class="profile-avatar">👨‍💻</div>
                <h1>Manish</h1>
                <p class="profile-role">Cloud/DevOps Engineer</p>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <i class="fas fa-user info-icon"></i>
                    <div>
                        <div class="info-label">Name</div>
                        <div class="info-value">Manish</div>
                    </div>
                </div>

                <div class="info-item">
                    <i class="fas fa-briefcase info-icon"></i>
                    <div>
                        <div class="info-label">Role</div>
                        <div class="info-value">Cloud/DevOps Engineer</div>
                    </div>
                </div>

                <div class="info-item">
                    <i class="fas fa-map-marker-alt info-icon"></i>
                    <div>
                        <div class="info-label">Location</div>
                        <div class="info-value">India</div>
                    </div>
                </div>

                <div class="info-item">
                    <i class="fas fa-envelope info-icon"></i>
                    <div>
                        <div class="info-label">Email</div>
                        <div class="info-value">manish@example.com</div>
                    </div>
                </div>
            </div>

            <div class="profile-actions">
                <a href="/skills" class="btn btn-primary">
                    <i class="fas fa-code"></i> View Skills
                </a>
                <a href="/welcome" class="btn btn-secondary">
                    <i class="fas fa-home"></i> Welcome
                </a>
            </div>
        </div>
    </div>
</body>
</html>
